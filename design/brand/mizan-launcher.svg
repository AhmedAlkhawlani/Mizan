<?xml version="1.0" encoding="UTF-8"?>
<!--
  ميزان — أيقونة التشغيل ٥١٢.
  خلفية شعاعية #12303C → #07090D، والشعار بمقياس ٠٫٨٦ حول المركز.
  أقصى نصف قطر للمحتوى ١٨٣ × ٠٫٨٦ = ١٥٧ من أصل ٢٥٦ — لا يُقصّ في القصّ الدائري.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="ميزان — أيقونة التشغيل">
  <defs>
    <radialGradient id="mzLbg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#12303C"/>
      <stop offset="0.55" stop-color="#0A141C"/>
      <stop offset="1" stop-color="#07090D"/>
    </radialGradient>
    <linearGradient id="mzLring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="mzLarrow" x1="196" y1="172" x2="344" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#38CFFF"/>
    </linearGradient>
    <radialGradient id="mzLhalo">
      <stop offset="0" stop-color="#FF4081" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FF4081" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF4081" stop-opacity="0"/>
    </radialGradient>
    <filter id="mzLglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#mzLbg)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#00E5FF" stroke-opacity="0.10" stroke-width="1"/>

  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#mzLring)" stroke-width="16"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#00E5FF" stroke-opacity="0.16" stroke-width="1.8"/>

    <g filter="url(#mzLglow)" fill="url(#mzLarrow)" stroke="none">
    <path d="M179,172 L213,172 L213,300 L227,300 L196,340 L165,300 L179,300 Z"/>
    <path d="M299,340 L333,340 L333,212 L347,212 L316,172 L285,212 L299,212 Z"/>
  </g>

    <circle cx="256" cy="256" r="72" fill="url(#mzLhalo)"/>
    <circle cx="256" cy="256" r="27" fill="#FF4081"/>
    <circle cx="256" cy="256" r="27" fill="none" stroke="#FFD1E0" stroke-opacity="0.7" stroke-width="1.6"/>
  </g>
</svg>
