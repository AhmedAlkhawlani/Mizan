  بلا توهّج ولا هالة ولا خط داخلي: التوهّج يذوّب السهمين عند ٤٨px.
  السماكات أثقل (١٨ للحلقة · ٣٦ للسهمين) واللؤلؤة أكبر بقليل.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="ميزان — أيقونة الأحجام الصغيرة">
  <defs>
